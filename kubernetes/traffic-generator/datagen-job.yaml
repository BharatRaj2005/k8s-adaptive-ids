# One dataset-generation session (filled in by src/datagen/jobs.py; not applied by hand).
# Same hardening as the other generator pods; the namespace egress NetworkPolicy applies.
apiVersion: batch/v1
kind: Job
metadata:
  name: PLACEHOLDER
  namespace: ids-traffic
  labels: {app: traffic-generator, mode: datagen}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 330
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app: traffic-generator, mode: datagen}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: generator
          image: python:3.13-alpine
          command: ["python", "/app/datagen_generator.py"]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: script, mountPath: /app, readOnly: true}
      volumes:
        - name: script
          configMap: {name: datagen-generator-script}
