apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Apply kubernetes/namespaces/ids-traffic.yaml first (kustomize cannot load files outside this directory).
namespace: ids-traffic
resources:
  - networkpolicy.yaml
  - benign-deployment.yaml
configMapGenerator:
  - name: traffic-generator-script
    files:
      - traffic_generator.py
  # generator v2: dataset generation and the dashboard's Attack Simulator Jobs
  - name: datagen-generator-script
    files:
      - datagen_generator.py
generatorOptions:
  # Stable name so the on-demand recon Job (recon-job.yaml) can reference it.
  disableNameSuffixHash: true
